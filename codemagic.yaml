workflows:
  ios-release:
    name: AG-ID iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: AGID
    environment:
      xcode: latest
    scripts:
      - name: Unpack project
        script: |
          unzip -o ag-id-ios.zip -d .
      - name: Install Capacitor
        script: |
          npm install
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch signing files from Apple
