          app-store-connect fetch-signing-files "au.com.ag-id.app" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/cert_key.pem
      - name: Add certs to keychain
        script: |
          keychain add-certificates
      - name: Set up signing
        script: |
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd ios/App && agvtool new-version -all $BUILD_NUMBER
      - name: Build app
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
